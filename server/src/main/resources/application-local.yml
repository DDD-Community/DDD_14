# 로컬 개발: H2와 ddl-auto=update
spring:
  datasource:
    url: jdbc:h2:mem:ttadak
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

logging:
  level:
    com.ttadak: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
